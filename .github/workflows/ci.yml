name: CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Test, Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run static analysis (oxlint)
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests (isolated harness, no Firebase needed)
        run: npm run test:browser

      - name: Check dependencies for known vulnerabilities (high and above)
        run: npm audit --omit=dev --audit-level=high

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7

  backend:
    name: Backend tests & audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Check dependencies for known vulnerabilities (high and above)
        run: npm audit --omit=dev --audit-level=high

  rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Run rule tests against the local emulator (demo project, never production)
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-money-manager "npm --prefix frontend run test:rules"

  lighthouse:
    name: Lighthouse (desktop + slow phone)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lighthouse desktop (fails below 90 in any category)
        run: npx lhci autorun

      - name: Lighthouse slow phone (warns below 80 performance)
        run: npx lhci autorun --config=lighthouserc.mobile.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: frontend/lighthouse-report
          retention-days: 14
