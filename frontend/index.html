<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Self-healing: if an older session requests a deleted JS chunk or gets a text/html MIME error
      window.addEventListener('error', function(e) {
        var msg = (e && (e.message || (e.error && e.error.message))) || '';
        var target = e.target || {};
        var isScriptError = target.tagName === 'SCRIPT' ||
          msg.indexOf('MIME type') !== -1 ||
          msg.indexOf('Loading chunk') !== -1 ||
          msg.indexOf('dynamically imported module') !== -1;
        if (isScriptError) {
          var lastReload = parseInt(sessionStorage.getItem('vm_chunk_crash_reload') || '0', 10);
          if (Date.now() - lastReload > 8000) {
            sessionStorage.setItem('vm_chunk_crash_reload', String(Date.now()));
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
            window.location.href = window.location.pathname + '?v=' + Date.now();
          }
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason || {};
        var msg = (reason && reason.message) || String(reason || '');
        if (
          msg.indexOf('MIME type') !== -1 ||
          msg.indexOf('dynamically imported module') !== -1 ||
          msg.indexOf('Loading chunk') !== -1 ||
          msg.indexOf('Failed to fetch') !== -1
        ) {
          var lastReload = parseInt(sessionStorage.getItem('vm_chunk_crash_reload') || '0', 10);
          if (Date.now() - lastReload > 8000) {
            sessionStorage.setItem('vm_chunk_crash_reload', String(Date.now()));
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
            window.location.href = window.location.pathname + '?v=' + Date.now();
          }
        }
      });
    </script>

    <!-- Viewport: cover = safe-area on notched phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- PWA: Theme matches app background -->
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="background-color" content="#1a1a2e" />

    <!-- App description for install dialog -->
    <meta name="description" content="Advanced Personal Finance & Money Manager — track spending, investments, bills and goals" />
    <meta name="application-name" content="Vault Manager" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Android: make status bar dark (matches theme) -->
    <meta name="msapplication-TileColor" content="#1a1a2e" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vault" />

    <!-- Open Graph (for sharing links) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vault Manager — Personal Finance" />
    <meta property="og:description" content="Track spending, investments, bills and goals. Advanced money management PWA." />
    <meta property="og:image" content="/icon-512.png" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-apple.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Critical resource hints — preconnect before React loads -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://money-manager-isuru.firebaseio.com" />
    <link rel="dns-prefetch" href="https://api.exchangerate-api.com" />

    <!-- Inline critical CSS: prevent FOUC on Android -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { background: #1a1a2e; color: #f0f0f5; height: 100%; overscroll-behavior: none; }
      #root { min-height: 100vh; min-height: 100dvh; }
      /* Spinner shown before React mounts */
      .preload-spinner {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #1a1a2e;
      }
      .preload-spinner::after {
        content: '';
        width: 36px; height: 36px; border-radius: 50%;
        border: 2px solid rgba(74,222,128,0.15);
        border-top-color: #4ade80;
        animation: _spin 0.85s linear infinite;
      }
      @keyframes _spin { to { transform: rotate(360deg); } }
    </style>

    <title>Vault Manager</title>
  </head>
  <body>
    <!-- Shown instantly before React hydrates — prevents blank white flash -->
    <div id="root"><div class="preload-spinner"></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
