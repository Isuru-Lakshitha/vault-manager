<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Self-healing: if an older session requests a deleted JS chunk or gets a text/html MIME error
      window.addEventListener('error', function(e) {
        var msg = (e && (e.message || (e.error && e.error.message))) || '';
        var target = e.target || {};
        var isScriptError = target.tagName === 'SCRIPT' ||
          msg.indexOf('MIME type') !== -1 ||
          msg.indexOf('Loading chunk') !== -1 ||
          msg.indexOf('dynamically imported module') !== -1;
        if (isScriptError) {
          var lastReload = parseInt(sessionStorage.getItem('vm_chunk_crash_reload') || '0', 10);
          if (Date.now() - lastReload > 8000) {
            sessionStorage.setItem('vm_chunk_crash_reload', String(Date.now()));
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
            window.location.href = window.location.pathname + '?v=' + Date.now();
          }
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason || {};
        var msg = (reason && reason.message) || String(reason || '');
        if (
          msg.indexOf('MIME type') !== -1 ||
          msg.indexOf('dynamically imported module') !== -1 ||
          msg.indexOf('Loading chunk') !== -1 ||
          msg.indexOf('Failed to fetch') !== -1
        ) {
          var lastReload = parseInt(sessionStorage.getItem('vm_chunk_crash_reload') || '0', 10);
          if (Date.now() - lastReload > 8000) {
            sessionStorage.setItem('vm_chunk_crash_reload', String(Date.now()));
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
            window.location.href = window.location.pathname + '?v=' + Date.now();
          }
        }
      });
    </script>

    <!-- Viewport: cover = safe-area on notched phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA: Theme matches app background -->
    <meta name="theme-color" content="#0e1013" />
    <meta name="background-color" content="#1a1a2e" />

    <!-- App description for install dialog -->
    <meta name="description" content="Advanced Personal Finance & Money Manager — track spending, investments, bills and goals" />
    <meta name="application-name" content="Vault Manager" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Android: make status bar dark (matches theme) -->
    <meta name="msapplication-TileColor" content="#1a1a2e" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vault" />

    <!-- Open Graph (for sharing links) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vault Manager — Personal Finance" />
    <meta property="og:description" content="Track spending, investments, bills and goals. Advanced money management PWA." />
    <meta property="og:image" content="/icon-512.png" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-apple.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Critical resource hints — preconnect before React loads -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking first paint (system font until ready). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Outfit:wght@300;400;500;600;700;800&amp;display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Outfit:wght@300;400;500;600;700;800&amp;display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Outfit:wght@300;400;500;600;700;800&amp;display=swap" /></noscript>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://money-manager-isuru.firebaseio.com" />
    <link rel="dns-prefetch" href="https://api.exchangerate-api.com" />

    <!-- Inline critical CSS: prevent FOUC on Android -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { background: #0e1013; color: #e8eaed; height: 100%; overscroll-behavior: none; }
      body.light-mode { background: #f3f6fa; color: #17283f; }
      #root { min-height: 100vh; min-height: 100dvh; }
      /* Branded splash, painted instantly (before any JavaScript runs).
         React replaces it on mount. */
      .preload {
        position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px;
        font: 600 17px/1.2 Inter, -apple-system, 'Segoe UI', system-ui, sans-serif; letter-spacing: -0.01em;
      }
      .preload-mark { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center;
        background: linear-gradient(135deg, #5b8def, #8b7cf6); box-shadow: 0 12px 32px -10px rgba(91,141,239,0.7); }
      .preload-bar { width: 120px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(127,127,127,0.18); }
      .preload-bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: inherit; background: #5b8def;
        animation: _load 1.1s ease-in-out infinite; }
      @keyframes _load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .preload-bar::after { animation: none; width: 100%; opacity: 0.5; } }
    </style>

    <title>Vault Manager</title>
  </head>
  <body>
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash.
      (function () {
        try {
          var p = localStorage.getItem('vm_theme') || 'dark';
          var light = p === 'light' || (p === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (light) document.body.classList.add('light-mode');
          document.documentElement.style.colorScheme = light ? 'light' : 'dark';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', light ? '#f6f7f9' : '#0e1013');
        } catch (e) {}
      })();
    </script>
    <!-- Shown instantly before React hydrates — prevents blank white flash -->
    <div id="root"><div class="preload" role="status" aria-label="Loading Vault Manager"><div class="preload-mark"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 18v-7"/><path d="M11.12 2.198a2 2 0 0 1 1.76.006l7.866 3.847c.476.233.31.949-.22.949H3.474c-.53 0-.695-.716-.22-.949z"/><path d="M14 18v-7"/><path d="M18 18v-7"/><path d="M3 22h18"/><path d="M6 18v-7"/></svg></div><div>Vault Manager</div><div class="preload-bar"></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
